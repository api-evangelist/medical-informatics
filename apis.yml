name: Medical Informatics
description: Medical Informatics Corp. (MIC) is a Houston, Texas healthcare technology
  company behind the FDA-cleared Sickbay platform for virtual and remote patient monitoring.
  Founded in 2010 by Emma Fauss and Craig Rusin, Sickbay archives, aggregates, and transforms
  otherwise unrecorded high-resolution physiological waveform data across disparate,
  vendor-neutral biomedical devices to enable anytime, anywhere remote monitoring, TeleICUs,
  alarm management, workflow automation, and patient-centered predictive analytics and AI
  across the continuum of care. The company is backed by DCVC, Intel Capital, Catalio Capital,
  and the Texas Medical Center. Sickbay is a clinical SaaS platform with no public developer
  API surface; integration is delivered through the vendor as HL7/device connectivity.
